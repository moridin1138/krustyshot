[package]
name = "rustshot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = "0.4.45"
directories = "6.0.0"
fs4 = "1"
gif = "0.14"
image = "0.25.10"
log = "0.4.34"
rustshot-i18n = { path = "../rustshot-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12"
toml = "1.1.8"
ureq = "3.4.2"
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media", "objc2-core-video", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFNumber"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-video = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSError", "NSObject", "NSProcessInfo", "NSArray"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.18"
