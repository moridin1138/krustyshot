[package]
name = "rustshot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6"
eframe = "0.36.2"
egui = "0.36.2"
egui-phosphor = "0.14"
env_logger = "0.11.11"
global-hotkey = "0.8.0"
log = "0.4.34"
rfd = "0.17.2"
rustshot-core = { path = "../rustshot-core" }
rustshot-editor = { path = "../rustshot-editor" }
rustshot-i18n = { path = "../rustshot-i18n" }
tray-icon = "0.26.1"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSRunningApplication", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSSet"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "rustshot"
path = "src/main.rs"

