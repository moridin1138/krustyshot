# Builds release packages when a version tag (v1.2.3) is pushed and
# attaches them to a *draft* GitHub release. Review the draft, then publish.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev
      - name: Build
        run: cargo build --release --locked -p rustshot-app --target ${{ matrix.target }}

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          RUSTSHOT_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Sign with Rustshot's self-signed certificate so macOS keeps
          # permissions across updates (see scripts/make-signing-cert.sh).
          if [ -n "$MACOS_SIGNING_P12_BASE64" ]; then
            export RUSTSHOT_SIGNING_P12="$RUNNER_TEMP/rustshot-signing.p12"
            echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$RUSTSHOT_SIGNING_P12"
          else
            echo "::warning::MACOS_SIGNING_P12_BASE64 is not set; building with an ad-hoc signature"
          fi
          scripts/bundle-macos.sh ${{ matrix.target }}
          rm -f "$RUNNER_TEMP/rustshot-signing.p12"
          cd target/${{ matrix.target }}/release/bundle
          ditto -c -k --keepParent Krustyshot.app "$GITHUB_WORKSPACE/Krustyshot-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # .cargo/config.toml builds the C runtime in; a fresh PC has no VCRUNTIME140.dll.
          $exe = "target/${{ matrix.target }}/release/krustyshot.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($dll in 'VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt-') {
            if ($text -match $dll) { throw "$exe needs $dll, which a fresh PC may not have" }
          }
          $dir = "Krustyshot-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/krustyshot.exe $dir/
          Copy-Item README.md, CHANGELOG.md, LICENSE $dir/ -ErrorAction SilentlyContinue
          Compress-Archive $dir "$dir.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="Krustyshot-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/krustyshot README.md CHANGELOG.md "$dir"/
          cp LICENSE "$dir"/ 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            Krustyshot-*.zip
            Krustyshot-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: dist/*
