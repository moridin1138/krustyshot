# Builds release packages when a version tag (v1.2.3) is pushed and
# attaches them to a *draft* GitHub release. Review the draft, then publish.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev
      - name: Build
        run: cargo build --release --locked -p rustshot-app --target ${{ matrix.target }}

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh ${{ matrix.target }}
          cd target/${{ matrix.target }}/release/bundle
          ditto -c -k --keepParent Rustshot.app "$GITHUB_WORKSPACE/Rustshot-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "Rustshot-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rustshot.exe $dir/
          Copy-Item README.md, CHANGELOG.md, LICENSE $dir/ -ErrorAction SilentlyContinue
          Compress-Archive $dir "$dir.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="Rustshot-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/rustshot README.md CHANGELOG.md "$dir"/
          cp LICENSE "$dir"/ 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            Rustshot-*.zip
            Rustshot-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          body_path: notes.md
          files: dist/*
